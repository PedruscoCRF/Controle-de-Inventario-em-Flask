<form method="post" action="{{ acao }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
        {% for nome, rotulo in campos %}
            <div class="col-md-6">
                <label class="form-label" for="{{ nome }}">{{ rotulo }} *</label>
                <input
                    class="form-control"
                    type="text"
                    id="{{ nome }}"
                    name="{{ nome }}"
                    value="{{ form[nome] }}"
                    maxlength="120"
                    autocomplete="off"
                    required
                >
            </div>
        {% endfor %}
    </div>

    <div class="d-flex flex-wrap gap-2 mt-4">
        <button class="btn btn-primary" type="submit">{{ rotulo_botao }}</button>
        <a class="btn btn-outline-dark" href="{{ cancelar_url }}">Cancelar</a>
    </div>
</form>
