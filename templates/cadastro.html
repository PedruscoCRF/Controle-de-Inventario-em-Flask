{% extends "base.html" %}

{% block title %}Cadastrar item | Controle de Inventário{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-7">
        <h1 class="h3 mb-1">Cadastrar novo item</h1>
        <p class="text-body-secondary">Os campos marcados com * são obrigatórios.</p>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="post" action="{{ url_for('cadastro') }}">
                    <div class="row g-3">
                        {% for nome, rotulo in campos %}
                            <div class="col-md-6">
                                <label class="form-label" for="{{ nome }}">{{ rotulo }} *</label>
                                <input
                                    class="form-control"
                                    type="text"
                                    id="{{ nome }}"
                                    name="{{ nome }}"
                                    value="{{ form[nome] }}"
                                    maxlength="120"
                                    autocomplete="off"
                                    required
                                >
                            </div>
                        {% endfor %}
                    </div>

                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <button class="btn btn-primary" type="submit">Cadastrar</button>
                        <a class="btn btn-outline-dark" href="{{ url_for('consulta') }}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
