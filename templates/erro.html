{% extends "base.html" %}

{% block title %}{{ titulo }} | Controle de Inventário{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h1 class="h4">{{ titulo }}</h1>
                <p class="text-body-secondary">{{ mensagem }}</p>
                <a class="btn btn-primary mt-2" href="{{ url_for('index') }}">Voltar ao início</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
